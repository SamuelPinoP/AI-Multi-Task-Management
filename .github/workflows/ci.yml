name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://app:app@localhost:5432/app_test?schema=public
  EMAIL_PROVIDER: disabled
  PROJECT_CHAT_DEFAULT_STORAGE_PROVIDER: local
  PROJECT_CHAT_VIDEO_STORAGE_PROVIDER: local

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Fail if schema.prisma and the migrations disagree
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:storage
      - name: Fail if Radix UI is installed twice
        run: node scripts/check-single-radix.mjs
      - name: Fail on high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  e2e:
    name: Playwright (server in UTC)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      # Test the production build: faster and steadier than a cold dev server.
      E2E_SERVER_MODE: start
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      # Every run keeps its report with a video, trace and screenshot of each test.
      - name: Upload the Playwright report and recordings
        id: report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Link the report from the run summary
        if: ${{ !cancelled() && steps.report.outputs.artifact-url }}
        run: |
          {
            echo "### Playwright report"
            echo ""
            echo "[Download the report with videos and traces](${{ steps.report.outputs.artifact-url }}) (kept 14 days)."
            echo "Unzip it and open \`playwright-report/index.html\`, or drop a \`trace.zip\` on https://trace.playwright.dev."
          } >> "$GITHUB_STEP_SUMMARY"

name: Bug report
description: Something in the app doesn't work as it should.
labels: ["type: bug"]
assignees: ["SamuelPinoP"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public: leave out passwords, tokens, emails and other personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Tasks page.
        2. Click New task and save it without a title.
        3. See the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Production
        - A Vercel preview
        - A local server
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows 11, Safari on an iPhone
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video or error messages
      description: Drag files here. Remove anything private first.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's fixed.
      value: |
        - [ ] The expected result above happens.
        - [ ] A test covers it, so it can't come back unnoticed.
    validations:
      required: true
